name: Android DEMO APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/android-demo.yml"

permissions:
  contents: read

jobs:
  build-demo:
    name: Build Prawko DEMO
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Assemble DEMO APK
        run: bash ./gradlew --no-daemon :app:assembleDebug -PprawkoDemo=true

      - name: Upload DEMO APK
        uses: actions/upload-artifact@v4
        with:
          name: prawko-demo-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
